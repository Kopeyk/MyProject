name: CI Pipeline

# Конвеєр запускається для pull request у develop, а також після подання рев'ю,
# щоб повторно перевірити PR, коли рев'ю схвалено.
on:
  pull_request:
    types: [opened, edited, reopened, synchronize, review_requested]
    branches:
      - develop
  pull_request_review:
    types: [submitted]

permissions:
  contents: read
  pull-requests: write

jobs:
  build:
    if: github.event.pull_request.base.ref == 'develop'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install -e .

      - name: Run tests
        run: pytest --junitxml=report.xml --cov=src --cov-report=xml --cov-report=term

      - name: Upload test reports
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            report.xml
            coverage.xml

  review-check:
    if: github.event.pull_request.base.ref == 'develop'
    runs-on: ubuntu-latest
    steps:
      - name: Перевірка цільової гілки PR
        run: |
          echo "PR #${{ github.event.pull_request.number }}: ${{ github.event.pull_request.head.ref }} -> ${{ github.event.pull_request.base.ref }}"
          if [ "${{ github.event.pull_request.base.ref }}" != "develop" ]; then
            echo "::error::PR має бути спрямований у гілку develop"
            exit 1
          fi

      - name: Перевірка наявності схваленого код-рев'ю
        uses: actions/github-script@v7
        with:
          script: |
            const prNumber = context.payload.pull_request.number;
            const { data: reviews } = await github.rest.pulls.listReviews({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: prNumber
            });
            console.log(`Знайдено рев'ю: ${reviews.length}`);
            for (const r of reviews) {
              console.log(`- ${r.user.login}: ${r.state}, ${r.submitted_at}, "${r.body || ''}"`);
            }
            const approved = reviews.some(review => review.state === 'APPROVED');
            if (!approved) {
              core.setFailed("Код-рев'ю не схвалено");
            } else {
              console.log("PR має схвалене код-рев'ю");
            }

  analysis:
    runs-on: ubuntu-latest
    needs: [build, review-check]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download test reports
        uses: actions/download-artifact@v4
        with:
          name: test-reports

      - name: Count lines of code with Cloc
        run: |
          sudo apt-get install -y cloc
          cloc src/ > cloc-report.txt
          cat cloc-report.txt

      - name: Run SonarQube analysis
        uses: SonarSource/sonarqube-scan-action@v5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

      - name: Запуск flake8 через Reviewdog
        uses: reviewdog/action-flake8@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          reporter: github-pr-review
          level: error
          fail_level: error

      - name: Запуск Black через Reviewdog
        uses: reviewdog/action-black@v1
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          reporter: github-pr-review
          level: info

      - name: Перевірка змін у гілці develop
        run: |
          git log origin/develop --oneline --graph > develop_changes.txt
          cat develop_changes.txt

      - name: Upload analysis reports
        uses: actions/upload-artifact@v4
        with:
          name: analysis-reports
          path: |
            cloc-report.txt
            develop_changes.txt
